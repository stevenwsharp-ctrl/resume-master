name: Deploy database and AI function to Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: xcycunyvotgmrwgutgty
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase link --project-ref $SUPABASE_PROJECT_REF
      - run: supabase db push
      - run: supabase secrets set ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
      - run: supabase functions deploy tailor
      - run: supabase functions deploy import-resume
      - run: supabase functions deploy revise
      # Email links (confirm account, reset password) go to the Site URL. If it is not set,
      # they go to localhost and sign-up never finishes. Set it to the GitHub Pages address.
      - name: Point Supabase sign-in emails at the live site
        run: |
          SITE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"site_url\": \"$SITE\", \"uri_allow_list\": \"$SITE,$SITE**,http://localhost:5173/**\"}" > /dev/null
          echo "Auth settings now:"
          curl -fsS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            | jq '{site_url, uri_allow_list, external_email_enabled, mailer_autoconfirm, disable_signup, smtp_host, rate_limit_email_sent}'
